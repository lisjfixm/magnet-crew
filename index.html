ie, gdy przełączasz zasilanie.`,`Budowanie, zmiana kierunku, zatrzymywanie i zasilanie — wszystkie umiejętności w akcji.`,`Dwa mosty do zbudowania, jeden budowniczy. Zatrzymaj go bezpiecznie między nimi, a potem pozwól mu iść dalej.`,`Jedno ogniwo zasila kolejno trzy mosty. Zatrzymaj ekipę w bezpiecznym miejscu, zanim przełączysz zasilanie.`,`Budowanie, przenośnik, dwa mosty i pauza — pełny egzamin wszystkich umiejętności.`],hints:[`Jeden zestaw pozwoli na stałe zabezpieczyć tę lukę.`,`Dotknij mostu A. Dzięki twojemu zasilaniu powstanie przejście.`,`Poczekaj, aż wszyscy przejdą przez most A, a potem przenieś zasilanie na B.`,`Dwa ogniwa zasilające, trzy mosty. Odwróć kierunek przenośnika.`,`Zbuduj pierwsze przejście. Zmień kierunek przenośnika i zasil most A.`,`Zabuduj obie luki. Poczekaj, aż wszyscy przejdą przez most A, zanim przeniesiesz zasilanie na B.`,`Zabuduj obie luki. Zmień kierunek przenośnika, gdy ekipa będzie tego potrzebować.`,`Zmień kierunek przenośnika, zabuduj środkową lukę, a potem przenieś zasilanie z A na B.`,`Buduj, steruj i łącz. Poczekaj, aż wszyscy przejdą przez most A, zanim przeniesiesz zasilanie na B.`,`Przydziel nowy zestaw po ukończeniu każdego mostu. Zmień kierunek obu przenośników.`,`Zbuduj przejście między A i B. Przenieś zasilanie z A na B, a potem z B na C, dopiero gdy wszyscy przejdą przez odpowiedni most.`,`Zbuduj wszystkie trzy przejścia. Zmień kierunek przenośników i przenieś zasilanie dopiero wtedy, gdy wszyscy przejdą przez most A.`,`Najpierw daj pierwszemu robotowi zestaw budowlany. Następnie zatrzymaj kolejnego dostępnego robota, podczas gdy budowniczy buduje drogę przed sobą. Gdy droga będzie gotowa, puść zatrzymanego robota dalej.`,`Zasil most A i przeprowadź całą ekipę na środkową platformę. Zatrzymaj ją tam, przełącz zasilanie na most B, a potem puść wszystkich dalej do wyjścia.`,`Najpierw wyznacz robota do budowania i odwróć kierunek taśmy przenośnika. Gdy droga będzie gotowa, zatrzymaj ekipę przy ostatniej luce, zasil most, a potem puść wszystkich dalej do wyjścia.`,`Daj pierwszemu robotowi zestaw do budowy mostu nad pierwszą luką. Gdy skończy, zatrzymaj go w bezpiecznym miejscu. Następnie puść go i daj mu drugi zestaw do budowy mostu nad drugą luką.`,`Zasil most A. Gdy cała ekipa przejdzie przez A, przełącz zasilanie na most B i skieruj taśmociąg w stronę wyjścia. Gdy wszyscy przejdą przez B, zatrzymaj pierwszego robota przed C, przełącz zasilanie na C i pozwól mu iść dalej.`,`Zbuduj most nad pierwszą luką, skieruj taśmociąg w stronę wyjścia i zasil most A. Gdy cała ekipa przejdzie przez A, zatrzymaj ją w bezpiecznym miejscu przed B, przełącz zasilanie na most B i pozwól jej iść dalej.`],lock:`Zakończ poprzednią stację`,scene:`Zagadka ratunkowa z robotami i magnetycznymi mostami`,resetBest:`Zakończono`,stationControls:`Sterowanie mostami`,status:`Status gry`,powerRiskConfirm:`Ekipa wciąż potrzebuje tego mostu. Dotknij ponownie, aby mimo to przełączyć zasilanie.`,holdToSwitch:`Zasilanie przełączy się, gdy ekipa przejdzie. Przytrzymaj przełącznik, aby przełączyć od razu.`},ye={build:`İnşa Et`,kits:`Kitler`,assignLead:`Robota inşa ettir`,robot:`Robot`,builder:`Köprü yapımcısı`,building:`inşa ediyor`,launchBuilder:`Ekibi başlat + inşa et`,noBuilder:`Uygun görev yok`,chooseRobot:`Vurgulanan bir robota dokun veya “Robota inşa ettir”i seç.`,buildHint:`Robot bir sonraki köprü boşluğuna ulaşmadan ona bir kit ver.`,launchHint:`“Robota inşa ettir” ekibi başlatır. Robot boşluğa kadar yürür ve köprüyü panel panel inşa eder.`,buildProgress:`Köprü yapımcın kalıcı paneller döşüyor. Ekip onu takip ediyor.`,stop:`Durdur`,holdLead:`Öndeki uygun robotu durdur`,releaseLead:`Durdurulan robotu bırak`,holding:`tutuluyor`,noHold:`Durdurulacak uygun robot yok`,chooseStopRobot:`Vurgulanan bir robota dokun veya “Öndeki uygun robotu durdur” seçeneğini seç.`,settings:`Ayarlar`,close:`Kapat`,effects:`Ses efektleri`,muteAll:`Tüm sesi kapat`,unmute:`Sesi aç`,muteActive:`Tüm sesler kapatıldı. Ses efekti ayarın ka an önce herkesin A'dan geçmesini bekle.`,`Her köprü tamamlandıktan sonra yeni bir kit ata. İki bandın da yönünü değiştir.`,`A ile B arasına köprü inşa et. Gücü A'dan B'ye, ardından B'den C'ye aktar. Her aktarımı ancak tüm ekip ilgili köprüden geçtikten sonra yap.`,`Üç yolu da inşa et. Bantların yönünü değiştir ve gücü ancak herkes A'dan geçtikten sonra aktar.`,`Önce ilk robota bir inşa kiti ver. Sonra inşaatçı önde yolu inşa ederken sıradaki uygun robotu durdur. Yol hazır olunca durdurduğun robotu bırak.`,`A köprüsüne güç ver ve tüm ekibin orta platforma ulaşmasını sağla. Ekibi orada durdur, gücü B köprüsüne aktar, ardından hepsini serbest bırakıp çıkışa gönder.`,`Önce bir robotu inşaatçı olarak görevlendir ve taşıma bandının yönünü tersine çevir. İnşaat tamamlanınca ekibi son boşluğun yakınında durdur. Köprüye güç ver, ardından ekibi serbest bırakıp çıkışa gönder.`,`İlk robota ilk boşluğa köprü kurması için bir kit ver. Köprüyü bitirince onu güvenli bir yerde durdur. Sonra serbest bırak ve ikinci boşluğa köprü kurması için ikinci bir kit ver.`,`A köprüsüne güç ver. Tüm ekip A'yı geçince gücü B köprüsüne aktar ve konveyör bandını çıkışa yönlendir. Herkes B'yi geçince öndeki robotu C'den önce durdur, gücü C'ye aktar ve robotu serbest bırak.`,`İlk boşluğa köprü kur, konveyör bandını çıkışa yönlendir ve A köprüsüne güç ver. Tüm ekip A'yı geçince onları B'den önce güvenli bir yerde durdur, gücü B köprüsüne aktar ve ekibi serbest bırak.`],lock:`Önceki istasyonu tamamla`,scene:`Manyetik köprülerle robot kurtarma bulmacası`,resetBest:`Tamamlandı`,stationControls:`Köprü kontrolleri`,status:`Oyun durumu`,powerRiskConfirm:`Ekibin bu köprüye hâlâ ihtiyacı var. Yine de gücü değiştirmek için tekrar dokun.`,holdToSwitch:`Ekip karşıya geçince güç değişir. Hemen değiştirmek için anahtarı basılı tut.`},be={build:`Строить`,kits:`Наборы`,assignLead:`Поручить роботу строить`,robot:`Робот`,builder:`Строитель`,building:`строит`,launchBuilder:`Запустить команду и строить`,noBuilder:`Нет д ит путь впереди, останови следующего подходящего робота. Когда путь будет готов, отпусти остановленного робота.`,`Один энергоэлемент, два моста. Останови команду на средней платформе, пока переключаешь питание.`,`Строй, меняй направление, останавливай и подавай питание — используй все навыки вместе!`,`Два моста, один строитель. Безопасно остановите его между стройками, затем отпустите дальше.`,`Один энергоэлемент по очереди питает три моста. Перед переключением питания остановите команду в безопасном месте.`,`Стройка, конвейер, два моста и остановка — полный экзамен на все навыки.`],hints:[`Один набор позволит навсегда закрыть этот разрыв.`,`Нажмите на мост A. Подайте питание, чтобы открыть путь.`,`Дождитесь, пока все перейдут мост A, затем переключите питание на B.`,`Два энергоэлемента, три моста. Разверните конвейер в обратную сторону.`,`Постройте первую переправу. Разверните конвейер и подайте питание на мост A.`,`Постройте мосты через оба разрыва. Дождитесь, пока все перейдут мост A, прежде чем переключать питание на B.`,`Постройте мосты через оба разрыва. Измените направление конвейера, когда это понадобится команде.`,`Измените направление конвейера, постройте мост через средний разрыв, затем переключите питание с A на B.`,`Стройте, направляйте и подключайте. Дождитесь, пока все перейдут мост A, прежде чем переключать питание на B.`,`После завершения каждого моста назначайте новый набор. Измените направление обоих конвейеров.`,`Постройте мост между A и B. Переключите питание с A на B, затем с B на C, каждый раз дожидаясь, пока все перейдут соответствующий мост.`,`Постройте все три пути. Измените направление конвейеров и переключайте питание только после того, как все перейдут мост A.`,`Сначала дай первому роботу строительный набор. Затем останови следующего подходящего робота, пока строитель прокладывает путь впереди. Когда путь будет готов, отпусти остановленного робота.`,`Подай питание на мост A и проведи всю команду на среднюю платформу. Останови команду там, переключи питание на мост B, затем отпусти всех к выходу.`,`Сначала назначь робота строителем и измени направление конвейера на обратное. Когда строительство завершится, останови команду у последнего разрыва. Подай питание на мост, затем отпусти всех к выходу.`,`Дайте первому роботу набор для постройки моста через первый разрыв. Когда мост будет готов, остановите робота в безопасном месте. Затем отпустите его и выдайте второй набор для постройки моста через второй разрыв.`,`Подайте питание на мост A. Когда вся команда перейдёт A, переключите питание на мост B и направьте конвейер к выходу. Когда все перейдут B, остановите ведущего робота перед C, переключите питание на C и отпустите его.`,`Постройте мост через первый разрыв, направьте конвейер к выходу и подайте питание на мост A. Когда вся команда перейдёт A, безопасно остановите её перед B, переключите питание на мост B и отпустите роботов.`],lock:`Завершите предыдущую станцию`,scene:`Головоломка спасения роботов с магнитными мостами`,resetBest:`Завершено`,stationControls:`Управление мостами`,status:`Статус игры`,powerRiskConfirm:`Команде ещё нужен этот мост. Нажмите ещё раз, чтобы всё равно переключить питание.`,holdToSwitch:`Питание переключится, когда команда перейдёт. Удерживайте переключатель, чтобы переключить сразу.`},xe={build:`Будувати`,kits:`Набори`,assignLead:`Нехай робот будує`,robot:`Робот`,builder:`Будівельник`,building:`будує`,launchBuilder:`Запустити команду + будувати`,noBuilder:`Немає доступного завдання`,chooseRobot:`Торкніться підсвіченого робота або оберіть «Нехай робот будує».`,buildHint:`Дайте роботу набір, перш ніж він дістанеться наступного розриву, де треба збудувати міст.`,launchHint:`«Нехай робот будує» запускає команду. Робот іде до розриву й будує міст панель за панеллю.`,buildProgress:`Ваш будівельник укладає незнімні панелі мосту. Команда йде за ним.`,stop:`Зупинити`,holdLead:`Зупинити першого доступного робота`,releaseLead:`Відпустити зупиненого робота`,holding:`утримується`,noHo вести всіх додому на кожній станції?`,crew:`Команда`,switches:`Дії`,help:`Дотик / Клацання`,keys:`A B C · Мости   F · Конвеєр   G · Будівельник   P · Пауза`,loading:`Готуємо вашу станцію…`,loadFailed:`Станцію не вдалося завантажити. Спробуйте ще раз.`,reload:`Завантажити знову`,busy:`Повернемося за хвилину…`,language:`Мова`,names:[`Збудовано вручну`,`Перше з'єднання`,`Передача живлення`,`Проти течії`,`Майстерня біля води`,`Остання зміна`,`Нова зміна`,`Перехресні течії`,`Кінцева зупинка`,`Майстерня мостів`,`Потрійне з'єднання`,`Велика подорож гаванню`,`Збудуй, зупини, відпусти`,`Перемикання живлення`,`Командна робота`,`Два розриви, одна пауза`,`Потрійний ланцюг із паузою`,`Іспит начальника порту`],descriptions:[`Один робот будує. Команда йде за ним.`,`Один маленький перемикач. Один величезний крок.`,`Одне коло. Два мости. Усе вирішує вчасне перемикання.`,`Розподіляйте живлення. Змінюйте напрямок.`,`Побудуйте шлях. Змініть напрямок конвеєра. Підключіть живлення.`,`Два набори. Одне коло живлення, яке можна перемикати між мостами.`,`Два місця для будівництва. Один конвеєр.`,`Одне місце для будівництва між двома мостами.`,`Два місця для будівництва, два конвеєри й одне коло живлення, яке можна перемикати між мостами.`,`Три місця для будівництва. Живлення не потрібне.`,`Один елемент живлення переміщується між трьома мостами.`,`Три будівельні завдання. Одна команда, що тримається разом.`,`Дай першому роботу будівельний набір. Поки він будує шлях попереду, зупини наступного доступного робота. Коли шлях буде готовий, відпусти зупиненого робота.`,`Один елемент живлення, два мости. Зупини команду на середній платформі, поки перемикаєш живлення.`,`Будуй, змінюй напрямок, зупиняй і подавай живлення — використовуй усі навички разом!`,`Дві будівельні роботи, один будівельник. Зупиніть його безпечно між ними, а потім відправте далі.`,`Один елемент живлення по черзі живить три мости. Перед перемиканням живлення зупиніть команду в безпечному місці.`,`Будівництво, конвеєр, два мости й пауза — повний іспит на всі навички.`],hints:[`Один набір назавжди зробить цей розрив безпечним.`,`Торкніться мосту A. Подайте живлення, щоб створити шлях.`,`Дочекайтеся, поки всі перейдуть міст A, а потім передайте живлення на B.`,`Два елементи живлення, три мости. Змініть напрямок конвеєра на протилежний.`,`Побудуйте перший перехід. Змініть напрямок конвеєра й подайте живлення на міст A.`,`Побудуйте мости через обидва розриви. Дочекайтеся, поки всі перейдуть міст A, перш ніж передавати живлення на B.`,`Побудуйте мости через обидва розриви. Змініть напрямок конвеєра, коли це знадобиться команді.`,`Змініть напрямок конвеєра, побудуйте міст через середній розрив, а потім передайте живлення з A на B.`,`Будуйте, скеровуйте та з'єднуйте. Дочекайтеся, поки всі перейдуть міст A, перш ніж передавати живлення на B.`,`Після завершення кожного мосту призначайте новий набір. Змініть напрямок обох конвеєрів.`,`Побудуйте міст між A і B. Передайте живлення з A на B, а потім з B на C. Щоразу дочекайтеся, поки всі перейдуть відповідний міст.`,`Побудуйте всі три шляхи. Змініть напрямок конвеєрів і передавайте живлення лише після того, як усі перейдуть міст A.`,`Спочатку дай першому роботу будівельний набір. Потім зупини наступного доступного робота, поки будівельник прокладає шлях попереду. Коли шлях буде готовий, відпусти зупиненого робота.`,`Подай живлення на міст A і переведи всю команду на середню платформу. Зупини команду там, перемкни живлення на міст B, а потім відпусти всіх до виходу.`,`Спочатку признач робота будівельником і зміни напрямок конвеєра на зворотний. Коли будівництво завершиться, зупини команду біля останнього розриву. Подай живлення на міст, а потім відпусти всіх до виходу.`,`Дайте першому роботу набір для будівництва мосту через перший розрив. Коли міст буде готовий, зупиніть робота в безпечному місці. Потім відпустіть його й дайте другий набір для будівництва мосту через другий розрив.`,`Подайте живлення на міст A. Коли вся команда перейде A, перемкніть живлення на міст B і спрямуйте конвеєр до виходу. Коли всі перейдуть B, зупиніть першого робота перед C, перемкніть живлення на C і відпустіть його.`,`Побудуйте міст через перший розрив, спрямуйте конвеєр до виходу й подайте живлення на міст A. Коли вся команда перейде A, зупиніть її в безпечному місці перед B, перемкніть живлення на міст B і відпустіть роботів.`],lock:`Завершіть попередню станцію`,scene:`Головоломка про рятування роботів з магнітними мостами`,resetBest:`Завершено`,stationControls:`Керування мостами`,status:`Стан гри`,powerRiskConfirm:`Команді ще потрібен цей міст. Торкніться ще раз, щоб усе ж перемкнути живлення.`,holdToSwitch:`Живлення перемкнеться, щойно команда перейде. Утримуйте перемикач, щоб перемкнути одразу.`},Se={build:`ابنِ`,kits:`الأطقم`,assignLead:`دع الروبوت يبني`,robot:`روبوت`,builder:`البنّاء`,building:`يبني`,launchBuilder:`ابدأ تحريك الفريق + البناء`,noBuilder:`لا توجد مهمة متاحة`,chooseRobot:`اضغط على روبوت مميز أو اختر «دع الروبوت يبني».`,buildHint:`أعطِ أحد الروبوتات طقم بناء قبل أن يصل إلى الفجوة التالية.`,launchHint:`«دع الروبوت يبني» يُطلق الفريق. يسير الروبوت إلى الفجوة ويبني الجسر لوحًا تلو الآخر.`,buildProgress:`يضع البنّاء ألواحًا دائمة للجسر، ويتبعه الفريق.`,stop:`أوقف`,holdLead:`أوقف أول روبوت مؤهل في المقدمة`,releaseLead:`حرّر الروبوت المتوقف`,holding:`قيد التثبيت`,noHold:`لا يوجد روبوت مناسب لإيقافه`,chooseStopRobot:`اضغط على روبوت مميز أو اختر «أوقف أول روبوت مؤهل في المقدمة».`,settings:`الإعدادات`,close:`إغلاق`,effects:`المؤثرات الصوتية`,muteAll:`كتم جميع الأصوات`,unmute:`إلغاء كتم الصوت`,muteActive:`تم كتم جميع الأصوات. حُفظ إعداد المؤثرات الصوتية.`,eyebrow:`فريق صغير. مهمة عظيمة.`,subtitle:`أعِد الجميع إلى الديار.`,level:`محطة`,saved:`تم إنقاذ`,goal:`الهدف`,time:`الوقت`,power:`الطاقة`,bridge:`الجسر`,on:`مُشغّل`,off:`مُطفأ`,occupied:`الفريق على الجسر`,clear:`الجسر خالٍ`,waiting:`بانتظار الطاقة`,belt:`الحزام الناقل`,wrongWay:`إلى الخلف`,rightWay:`إلى الأمام`,transfer:`تنتقل الطاقة من`,intro:`اضغط على الجسر A. طاقتك تفتح robot:`Robot`,builder:`Thợ xây`,building:`đang xây`,launchBuilder:`Cho đội xuất phát + xây`,noBuilder:`Không có nhiệm vụ nào`,chooseRobot:`Chạm vào robot được đánh dấu hoặc chọn “Cho robot xây cầu”.`,buildHint:`Giao bộ dụng cụ cho robot trước khi nó đến khoảng trống tiếp theo cần xây cầu.`,launchHint:`“Cho robot xây cầu” sẽ cho cả đội xuất phát. Robot đi đến khoảng trống và xây cầu từng tấm một.`,buildProgress:`Robot thợ xây lắp từng tấm cầu vĩnh viễn. Cả đội đi theo sau.`,stop:`Dừng`,holdLead:`Giữ robot đủ điều kiện đi đầu`,releaseLead:`Thả robot đang bị giữ`,holding:`đang bị giữ`,noHold:`Không có robot phù hợp để giữ`,chooseStopRobot:`Chạm vào robot được tô sáng hoặc chọn “Giữ robot đủ điều kiện đi đầu”.`,settings:`Cài đặt`,close:`Đóng`,effects:`Hiệu ứng âm thanh`,muteAll:`Tắt tiếng toàn bộ`,unmute:`Bật âm thanh`,muteActive:`Đã tắt toàn bộ âm thanh. Cài đặt hiệu ứng âm thanh của bạn đã được lưu.`,eyebrow:`ĐỘI NHỎ. SỨ MỆNH LỚN.`,subtitle:`Đưa tất cả về nhà.`,level:`Trạm`,saved:`Đã giải cứu`,goal:`Mục tiêu`,time:`Thời gian`,power:`Năng lượng`,bridge:`Cầu`,on:`BẬT`,off:`TẮT`,occupied:`Đội đang trên cầu`,clear:`Cầu đã trống`,waiting:`Đang chờ năng lượng`,belt:`Băng chuyền`,wrongWay:`Đi lùi`,rightWay:`Đi tới`,transfer:`Chuyển năng lượng từ`,intro:`Chạm vào cầu A. Năng lượng của bạn sẽ tạo lối đi.`,keepPowered:`Cầu A đang được cấp năng lượng. Giữ cầu A bật cho đến khi tất cả qua hết. Chạm lần nữa sẽ tắt cầu.`,headingHome:`Mọi người đã qua hết! Đội đang trên đường về nhà.`,risk:`Cẩn thận: đội vẫn còn cần cây cầu này.`,safeTransfer:`Giờ có thể chuyển năng lượng an toàn.`,waitForCrew:`Chờ đội qua cầu.`,transferNow:`Chuyển năng lượng ngay!`,turnBelt:`Đổi hướng băng chuyền sang phải để tiếp tục di chuyển.`,readyHint:`Chú ý các khoảng trống! Chờ tất cả qua hết rồi cấp năng lượng cho cầu tiếp theo kịp lúc.`,lastHint:`Hai pin năng lượng. Ba cây cầu. Và một băng chuyền đang chạy sai hướng…`,pause:`Tạm dừng`,resume:`Tiếp tục`,paused:`Nghỉ lấy hơi một chút.`,pauseNote:`Đội của bạn đang chờ bạn.`,retry:`Thử lại`,speed:`Tốc độ`,sound:`Âm thanh`,soundOn:`Đã bật âm thanh`,soundOff:`Đã tắt âm thanh`,won:`Nhà là nơi tuyệt nhất!`,perfect:`Tất cả robot nhỏ đều đã về nhà.`,wonSome:`Đã đạt mục tiêu cứu hộ.`,lost:`Thử lại lần nữa?`,lostNote:`Quá nhiều robot rơi xuống nước! Hãy xây lối qua tiếp theo hoặc cấp năng lượng cho cầu tiếp theo kịp lúc!`,timeout:`Hết thời gian. Hãy thử một nhịp độ khác.`,next:`Trạm tiếp theo`,again:`Chơi lại`,finished:`Đã hoàn thành cả 18 trạm!`,finishedNote:`Đội của bạn gửi lời cảm ơn. Bạn có thể đưa mọi người về nhà ở mọi trạm không?`,crew:`Đội`,switches:`Hành động`,help:`Chạm / Nhấp`,keys:`A B C · Cầu   F · Băng chuyền   G · Thợ xây   P · Tạm dừng`,loading:`Đang chuẩn bị trạm của bạn…`,loadFailed:`Không thể tải trạm. Vui lòng thử lại.`,reload:`Tải lại`,busy:`Sẽ quay lại ngay…`,language:`Ngôn ngữ`,names:[`Xây thủ công`,`Kết nối đầu tiên`,`Chuyển năng lượng`,`Ngược dòng`,`Xưởng bên bờ nước`,`Ca làm cuối`,`Ca làm mới`,`Những dòng chảy giao nhau`,`Điểm dừng cuối`,`Xưởng xây cầu`,`Kết nối ba cầu`,`Chuyến tham quan cảng lớn`,`Xây, giữ rồi thả`,`Chuyển nguồn điện`,`Phối hợp đồng đội`,`Hai khoảng trống, một lần dừng`,`Chuỗi ba cầu có dừng`,`Bài thử của trưởng cảng`],descriptions:[`Một robot xây cầu. Cả đội đi theo.`,`Một công tắc nhỏ. Một bước tiến lớn.`,`Một mạch điện. Hai cây cầu. Tất cả phụ thuộc vào thời điểm bạn chọn.`,`Chia sẻ năng lượng. Đổi hướng.`,`Xây lối đi. Đổi hướng băng chuyền. Kết nối năng lượng.`,`Hai bộ dụng cụ. Một mạch điện được chuyển giữa các cầu.`,`Hai vị trí xây dựng. Một băng chuyền.`,`Một vị trí xây dựng giữa hai cây cầu.`,`Hai vị trí xây dựng, hai băng chuyền và một mạch điện được chuyển giữa các cầu.`,`Ba vị trí xây dựng. Không cần năng lượng.`,`Một pin năng lượng được chuyển giữa ba cây cầu.`,`Ba nhiệm vụ xây dựng. Một đội luôn sát cánh bên nhau.`,`Giao bộ dụng cụ xây dựng cho robot đầu tiên. Giữ robot phù hợp tiếp theo trong lúc robot đầu xây đường, rồi thả robot đang bị giữ.`,`Một pin năng lượng, hai cây cầu. Giữ cả đội trên bục giữa trong lúc chuyển nguồn điện.`,`Xây dựng, đổi hướng, giữ robot và cấp điện — phối hợp mọi kỹ năng!`,`Hai chỗ cần xây cầu, chỉ một robot xây dựng. Giữ robot ở nơi an toàn giữa hai chỗ, rồi cho đi tiếp.`,`Một pin năng lượng lần lượt cấp điện cho ba cây cầu. Giữ cả đội ở nơi an toàn trước khi chuyển nguồn điện.`,`Xây dựng, băng chuyền, hai cây cầu và một lần dừng — bài kiểm tra đầy đủ mọi kỹ năng.`],hints:[`Một bộ dụng cụ giúp khoảng trống này an toàn vĩnh viễn.`,`Chạm vào cầu A. Năng lượng của bạn sẽ tạo lối đi.`,`Chờ tất cả qua hết cầu A rồi chuyển năng lượng sang B.`,`Hai pin năng lượng, ba cây cầu. Đảo chiều băng chuyền.`,`Xây lối qua đầu tiên. Đổi hướng băng chuyền và cấp năng lượng cho cầu A.`,`Xây cầu qua cả hai khoảng trống. Chờ tất cả qua hết cầu A trước khi chuyển năng lượng sang B.`,`Xây cầu qua cả hai khoảng trống. Đổi hướng băng chuyền khi đội cần.`,`Đổi hướng băng chuyền, xây cầu qua khoảng trống ở giữa rồi chuyển năng lượng từ A sang B.`,`Xây, điều hướng và kết nối. Chờ tất cả qua hết cầu A trước khi chuyển năng lượng sang B.`,`Giao bộ dụng cụ mới sau khi hoàn thành mỗi cây cầu. Đổi hướng cả hai băng chuyền.`,`Xây cầu giữa A và B. Chuyển năng lượng từ A sang B rồi sang C, nhưng chỉ sau khi tất cả đã qua cầu tương ứng.`,`Xây cả ba lối đi. Đổi hướng các băng chuyền và chỉ chuyển năng lượng sau khi tất cả đã qua cầu A.`,`Trước tiên, giao bộ dụng cụ xây dựng cho robot đầu tiên. Sau đó, giữ robot đủ điều kiện tiếp theo trong lúc robot xây dựng làm đường phía trước. Khi đường đã xong, hãy thả robot đang bị giữ.`,`Cấp điện cho cầu A và đưa cả đội lên bục giữa. Giữ cả đội tại đó, chuyển nguồn điện sang cầu B, rồi thả mọi robot đi tiếp đến lối ra.`,`Trước tiên, giao nhiệm vụ xây dựng cho một robot và đảo chiều băng chuyền. Khi xây dựng xong, giữ cả đội gần khoảng trống cuối cùng, cấp điện cho cầu, rồi thả mọi robot đi tiếp đến lối ra.`,`Giao cho robot đầu tiên một bộ dụng cụ để xây cầu qua khoảng trống đầu tiên. Khi xây xong, giữ robot lại ở nơi an toàn. Sau đó thả robot và giao bộ dụng cụ thứ hai để xây cầu qua khoảng trống thứ hai.`,`Cấp điện cho cầu A. Khi cả đội đã qua A, chuyển điện sang cầu B và hướng băng chuyền về phía lối ra. Khi tất cả đã qua B, chặn robot dẫn đầu trước C, chuyển điện sang C rồi cho robot đi tiếp.`,`Xây cầu qua khoảng trống đầu tiên, hướng băng chuyền về phía lối ra và cấp điện cho cầu A. Khi cả đội đã qua A, giữ họ ở nơi an toàn trước B, chuyển điện sang cầu B rồi cho cả đội đi tiếp.`],lock:`Hoàn thành trạm trước`,scene:`Trò chơi giải đố cứu robot với cầu từ tính`,resetBest:`Đã hoàn thành`,stationControls:`Điều khiển cầu`,status:`Trạng thái trò chơi`,powerRiskConfirm:`Cả đội vẫn cần cây cầu này. Chạm lần nữa nếu vẫn muốn chuyển điện.`,holdToSwitch:`Năng lượng sẽ chuyển khi cả đội đã qua. Nhấn giữ công tắc để chuyển ngay.`},Ee={build:`Bangun`,kits:`Kit`,assignLead:`Biarkan robot membangun`,robot:`Robot`,builder:`Robot pembangun`,building:`membangun`,launchBuilder:`Mulai kru + bangun`,noBuilder:`Tidak ada tugas yang tersedia`,chooseRobot:`Ketuk robot yang disorot, atau pilih “Biarkan robot membangun”.`,buildHint:`Berikan kit kepada robot sebelum ia mencapai celah berikutnya yang harus dijembatani.`,launchHint:`“Biarkan robot membangun” membuat kru mulai berjalan. Robot menuju celah dan membangun jembatan panel demi panel.`,buildProgress:`Robot pembangunmu memasang panel jembatan permanen. Kru mengikutinya.`,stop:`Hentikan`,holdLead:`Tahan robot terdepan yang bisa ditahan`,releaseLead:`Lepaskan robot yang ditahan`,holding:`sedang ditahan`,noHold:`Tidak ada robot yang bisa ditahan`,chooseStopRobot:`Ketuk robot yang disorot atau pilih “Tahan robot terdepan yang bisa ditahan”.`,settings:`Pengaturan`,close:`Tutup`,effects:`Efek suara`,muteAll:`Bisukan semua audio`,unmute:`Aktifkan kembali audio`,muteActive:`Semua audio dibisukan. Pengaturan efek suaramu tersimpan.`,eyebrow:`KRU KECIL. MISI BESAR.`,subtitle:`Bawa semuanya pulang.`,level:`Stasiun`,saved:`Terselamatkan`,goal: ,keys:`A B C · 다리   F · 컨베이어   G · 건설 로봇   P · 일시정지`,loading:`정거장을 준비하는 중…`,loadFailed:`정거장을 불러올 수 없습니다. 다시 시도해 주세요.`,reload:`다시 불러오기`,busy:`잠시만 기다려 주세요…`,language:`언어`,names:[`손으로 건설`,`첫 연결`,`전력 전달`,`물살을 거슬러`,`물가의 작업장`,`마지막 교대 근무`,`새로운 교대 근무`,`교차하는 물살`,`마지막 정거장`,`다리 작업장`,`삼중 연결`,`항구 대탐험`,`건설, 정지, 재출발`,`전력 전환`,`팀워크`,`두 개의 틈, 한 번의 정지`,`멈춤이 있는 3연속 다리`,`항만장의 시험`],descriptions:[`로봇 한 대가 건설하고 크루가 뒤따릅니다.`,`작은 스위치 하나. 커다란 한 걸음.`,`회로 하나. 다리 두 개. 타이밍이 중요합니다.`,`전력을 나누고 방향을 바꾸세요.`,`길을 건설하고 컨베이어 방향을 바꾼 뒤 전력을 연결하세요.`,`키트 두 개. 다리 사이에서 전력을 옮기는 회로 하나.`,`건설 지점 두 곳. 컨베이어 벨트 하나.`,`다리 두 개 사이에 건설 지점 하나.`,`건설 지점 두 곳, 컨베이어 벨트 두 개, 다리 사이에서 전력을 옮기는 회로 하나.`,`건설 지점 세 곳. 전력은 필요 없습니다.`,`전력 셀 하나를 세 다리 사이에서 옮깁니다.`,`건설 작업 세 가지. 끝까지 함께하는 크루 하나.`,`첫 번째 로봇에게 건설 키트를 주세요. 첫 번째 로봇이 앞쪽에 길을 만드는 동안 다음으로 멈출 수 있는 로봇을 멈추고, 길이 완성되면 다시 움직이게 하세요.`,`전력 셀 하나, 다리 두 개. 중간 발판에 크루를 멈추고 전력을 전환하세요.`,`건설, 방향 전환, 정지, 전력 공급! 모든 기술을 함께 활용하세요.`,`두 개의 건설 작업, 한 명의 건설 로봇. 둘 사이에서 안전하게 멈추게 한 다음 보내세요.`,`전력 셀 하나로 세 다리에 차례로 전력을 공급하세요. 전력을 전환하기 전에 크루를 안전한 곳에 멈춰 세우세요.`,`건설, 컨베이어, 다리 두 개, 그리고 정지 — 모든 기술을 시험하는 완전한 도전.`],hints:[`키트 하나면 이 틈을 영구적으로 안전하게 만들 수 있습니다.`,`다리 A를 탭하세요. 전력이 길을 만듭니다.`,`모두 다리 A를 건넌 다음 전력을 B로 옮기세요.`,`전력 셀 두 개, 다리 세 개. 컨베이어 방향을 반대로 바꾸세요.`,`첫 번째 건널 길을 건설하세요. 컨베이어 방향을 바꾸고 다리 A에 전력을 공급하세요.`,`두 틈에 모두 다리를 건설하세요. 모두 A를 건넌 뒤 전력을 B로 옮기세요.`,`두 틈에 모두 다리를 건설하세요. 크루가 필요할 때 컨베이어 방향을 바꾸세요.`,`컨베이어 방향을 바꾸고 가운데 틈에 다리를 건설한 뒤 전력을 A에서 B로 옮기세요.`,`건설하고, 방향을 바꾸고, 연결하세요. 모두 A를 건넌 뒤 전력을 B로 옮기세요.`,`다리를 하나 완성할 때마다 새 키트를 배정하세요. 두 컨베이어의 방향을 모두 바꾸세요.`,`A와 B 사이에 다리를 건설하세요. 모두 해당 다리를 건넌 뒤에만 전력을 A에서 B로, 이어서 B에서 C로 옮기세요.`,`세 길을 모두 건설하세요. 컨베이어 방향을 바꾸고, 모두 다리 A를 건넌 뒤에만 전력을 옮기세요.`,`먼저 첫 번째 로봇에게 건설 키트를 주세요. 그런 다음 건설 로봇이 앞쪽에 길을 만드는 동안 다음으로 멈출 수 있는 로봇을 멈추세요. 길이 완성되면 멈춰 둔 로봇을 다시 움직이게 하세요.`,`먼저 다리 A에 전력을 공급하고 크루 전원을 중간 발판으로 이동시키세요. 그곳에서 크루를 멈추고 전력을 다리 B로 전환한 다음, 모두 다시 움직여 출구로 향하게 하세요.`,`먼저 로봇 한 대를 건설 담당으로 지정하고 컨베이어의 방향을 반대로 바꾸세요. 건설이 끝나면 마지막 틈 근처에서 크루를 멈추세요. 다리에 전력을 공급한 뒤 모두 다시 움직여 출구로 향하게 하세요.`,`첫 번째 로봇에게 키트를 줘서 첫 번째 틈에 다리를 놓게 하세요. 완성하면 안전한 곳에서 멈추세요. 그런 다음 다시
